<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>私人的乌托邦</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="loading">
  <div class="loading-cube"></div>
  <p>正在进入乌托邦...</p>
</div>

<canvas id="mars-scene"></canvas>

<div id="vignette"></div>
<div id="haze-bottom"></div>

<main id="text-overlay">
  <header id="title-screen">
    <h1>私人的乌托邦</h1>
    <p class="subtitle">A-side 生命活力 &nbsp;/&nbsp; B-side 身后事</p>
    <p class="hint">向下滚动开始阅读</p>
    <div class="scroll-indicator">↓</div>
  </header>
  <div id="segments-container"></div>
</main>

<nav id="chapter-nav">
  <button id="nav-toggle" title="章节目录">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/>
      <rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>
  </button>
  <div id="nav-panel" class="hidden">
    <h3>目录</h3>
    <ul id="nav-list"></ul>
  </div>
</nav>

<div id="controls">
  <button id="btn-side-a" class="ctrl-btn active" title="显示A面">A</button>
  <button id="btn-side-b" class="ctrl-btn active" title="显示B面">B</button>
  <button id="btn-atmosphere" class="ctrl-btn atm-btn" title="大气浓度">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <circle cx="9" cy="4" r="2.5" stroke="currentColor" stroke-width="1.2" opacity="0.55"/>
      <circle cx="9" cy="11" r="3.5" stroke="currentColor" stroke-width="1.2" opacity="0.75"/>
      <circle cx="9" cy="14.5" r="2" stroke="currentColor" stroke-width="1.2" opacity="0.9"/>
    </svg>
    <span class="atm-dots"></span>
  </button>
</div>

<div id="progress-bar"><div id="progress-fill"></div></div>

<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.min.js"
  }
}
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
